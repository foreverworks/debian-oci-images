# A version tag (v1.2.3) publishes a release. A tag comes from release-next.yml, which tags a merge to
# main that changed an input and dispatches this workflow on the tag, or from a maintainer, whose push
# of the tag starts it. Only administrators may move or delete a v* tag (a ruleset), and the
# environment `release` takes deployments from v* tags only. Nothing else here ever publishes.
#
# Two jobs, so the job that runs Debian's package scripts as root in a privileged builder never holds a
# write token (DESIGN.md, section 6):
#   build    plans the whole chain at the lock's snapshots, builds, tests and verifies every image,
#            with a read-only token, and hands the output on as a workflow artifact;
#   publish  pushes debian to ghcr.io/foreverworks/debian and node-* to ghcr.io/foreverworks/node with
#            their records (one publish --image per repository), verifies every pushed image with all
#            of its required checks, puts the core tarball on this tag's GitHub release and verifies
#            it there, signs each image digest keyless with Sigstore, and only then moves the tags
#            (scripts/release).
#
# The build is the whole chain on purpose, whatever the registry holds: a release is one set of images
# at one pair of snapshots, and an image reused from an earlier release would carry a tag that names
# snapshots it was not built at. The factory can reuse one (`test --parents` reads a parent from a
# registry); this repository chooses not to (DESIGN.md, section 6).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # on a tag, by release-next.yml: a tag the workflow token creates starts nothing

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build, test and verify every image
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tag is a version and names a commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "$TAG is not vMAJOR.MINOR.PATCH" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main" >&2; exit 1; }

      - name: System packages (apt, gpgv and Debian's archive keyring, which planning needs)
        run: |
          set -eu
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends apt gpgv debian-archive-keyring curl
          test -s /usr/share/keyrings/debian-archive-keyring.pgp
          docker info > /dev/null

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: The factory release and builder the repository pins, signatures verified
        env:
          FACTORY_COSIGN: required
        run: scripts/factory install

      - name: Plan at the lock's snapshots
        run: |
          set -eu
          mkdir -p work
          scripts/factory plan --snapshot lock --out work/plan.json
          python3 scripts/images.py plan work/plan.json

      - name: Fetch
        run: scripts/factory fetch work/plan.json

      - name: Build
        run: scripts/factory build work/plan.json --out work/out

      - name: Test
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/factory test work/out --url "$RUN_URL"

      - name: Verify every artifact against its records, every required check passing
        run: |
          set -eu
          . scripts/jobs.sh
          mkdir work/jobs
          jobs_begin work/jobs
          for core in work/out/core-*.tar.gz; do
            job core scripts/factory verify "$core" --require-checks --lock lock.json --definition factory.toml
          done
          python3 scripts/images.py layouts work/out > work/layouts.txt
          while read -r image _digest layout _records; do
            job "$image" scripts/factory verify "work/out/$layout" --require-checks --lock lock.json --definition factory.toml
          done < work/layouts.txt
          jobs_settle

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: work/out
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish, verify, sign and tag
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # the tag's GitHub release, for the core tarball and its records
      packages: write # ghcr.io/foreverworks/debian and ghcr.io/foreverworks/node
      id-token: write # keyless Sigstore signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: work/out

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: 1.4.0

      - name: The factory release the repository pins, signature verified, without the builder (this job never builds)
        env:
          FACTORY_COSIGN: required
          FACTORY_BUILDER: skip
        run: scripts/factory install

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish, verify, sign, then tag
        env:
          SIGN: keyless
          RELEASE: github-release://${{ github.repository }}@${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/release work/out ghcr.io/foreverworks
