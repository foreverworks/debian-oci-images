# Does the newest Debian snapshot change any published image? The two archives, debian and
# debian-security, are pinned apart, each at its own snapshot. If the newest of both change an image, this
# workflow writes the two IDs to the `snapshot-feed` branch (debian-snapshot.json and
# debian-security-snapshot.json) and ticks the Dependency Dashboard's "run again" box, and Renovate
# (renovate.json, the two snapshot datasources) opens one pull request that moves both of lock.json's
# debian_snapshots to them. That pull request merges itself once CI passes, and the merge releases
# (release-next.yml).
#
# What starts it:
#   - the hourly schedule, the fallback that needs nobody to call;
#   - repository_dispatch (type upstream-changed) or workflow_dispatch, how an outside poller starts it
#     within a minute or two of a change upstream. Both carry the same three optional keys, in
#     client_payload or in the inputs: `source` (debian, node or manual), `snapshot` (the newest
#     completed snapshot the caller saw, YYYYMMDDTHHMMSSZ), `archive` (debian or debian-security: the
#     archive that snapshot belongs to, debian-security when it is left out) and `seen_at` (the RFC 3339
#     time it saw the change). A key that fails its format is ignored with a warning, and a snapshot
#     whose archive is bad goes with it;
#   - the end of every release run, because a dispatch that arrives while a release is under way is
#     skipped (below) and would otherwise wait for the next hour.
#
# The plan runs against what the last release published (the two ghcr.io repositories and the core
# tarball on its GitHub release), so it answers exactly "would a release now build anything new?".
# A snapshot whose uploads touch no package of these images builds nothing and moves nothing.
#
# snapshot.debian.org records the main archive about every six hours and the security archive each time
# it changes, often several times a day. It caches its listing for up to ten minutes, but a snapshot
# named explicitly is confirmed by a read that bypasses that cache. So when the caller names the
# snapshot it saw and the listing is behind it, scripts/plan-snapshots plans again at once with the
# caller's snapshot for its archive and the listing's for the other, and does not wait for the cache.
# A plan that fails (a mirror that does not serve a listed snapshot's files yet, a rate limit) is tried
# again, a minute apart, for about ten minutes. Planning downloads only the signed indices.
#
# A Node.js release changes no Debian snapshot: for source node the plan and the feed are skipped, and the
# only job is to tick the dashboard's box, so Renovate's node-version datasource opens that pull request.
#
# Three jobs, so the job that talks to the archive never holds a write token, and the two that write
# hold one scope each (DESIGN.md, section 6).
name: snapshot

on:
  schedule:
    - cron: "41 * * * *"
  repository_dispatch:
    types: [upstream-changed]
  workflow_dispatch:
    inputs:
      source:
        description: "What changed: debian, node or manual"
        type: string
        default: manual
        required: false
      snapshot:
        description: "The newest completed snapshot the caller saw, YYYYMMDDTHHMMSSZ"
        type: string
        required: false
      archive:
        description: "The archive of that snapshot: debian or debian-security (default debian-security)"
        type: string
        required: false
      seen_at:
        description: "When the caller saw the change, RFC 3339 UTC"
        type: string
        required: false
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

# A Node.js run only ticks the dashboard, so it queues apart: a later Debian plan or cron run never
# replaces a pending Node one (a group keeps one pending run and drops the older).
concurrency:
  group: snapshot-${{ (github.event.client_payload.source == 'node' || inputs.source == 'node') && 'node' || 'plan' }}
  cancel-in-progress: false

jobs:
  # What started this run, read once for every job, Node.js dispatches included.
  trigger:
    name: read what started this run
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.read.outputs.source }}
      asked_snapshot: ${{ steps.read.outputs.asked_snapshot }}
      asked_archive: ${{ steps.read.outputs.asked_archive }}
    steps:
      # What started this run. The values come from whoever dispatched it, so they pass through env:,
      # are checked against their format, and are never printed back: a bad one is ignored.
      - name: Read what started this run, and how long the start took
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IN_SOURCE: ${{ github.event.client_payload.source || inputs.source }}
          IN_SNAPSHOT: ${{ github.event.client_payload.snapshot || inputs.snapshot }}
          IN_ARCHIVE: ${{ github.event.client_payload.archive || inputs.archive }}
          IN_SEEN_AT: ${{ github.event.client_payload.seen_at || inputs.seen_at }}
        run: |
          set -eu
          source=manual
          case "$IN_SOURCE" in
            debian | node | manual) source=$IN_SOURCE ;;
            "") ;;
            *) echo "::warning::ignoring the source: it is not debian, node or manual" ;;
          esac
          asked=
          archive=
          if [ -n "$IN_SNAPSHOT" ]; then
            if [[ $IN_SNAPSHOT =~ ^[0-9]{8}T[0-9]{6}Z$ ]]; then
              asked=$IN_SNAPSHOT
              archive=debian-security
            else
              echo "::warning::ignoring the snapshot: it is not YYYYMMDDTHHMMSSZ"
            fi
            # The archive says which of the two the snapshot belongs to. A bad one takes the snapshot with it:
            # a snapshot read as the wrong archive's would send the plan to look for what is not there.
            case "$IN_ARCHIVE" in
              debian | debian-security) archive=$IN_ARCHIVE ;;
              "") ;;
              *)
                echo "::warning::ignoring the snapshot: its archive is not debian or debian-security"
                asked=
                archive=
                ;;
            esac
          fi
          seen=
          if [ -n "$IN_SEEN_AT" ]; then
            if [[ $IN_SEEN_AT =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$ ]] &&
              date -d "$IN_SEEN_AT" +%s > /dev/null 2>&1; then
              seen=$IN_SEEN_AT
            else
              echo "::warning::ignoring seen_at: it is not an RFC 3339 time"
            fi
          fi
          {
            echo "source=$source"
            echo "asked_snapshot=$asked"
            echo "asked_archive=$archive"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$seen" ]; then
            # A log line only: an API blip must not stop the plan.
            created=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq .created_at) || created=
            if [ -n "$created" ]; then
              latency=$(($(date -d "$created" +%s) - $(date -d "$seen" +%s)))
              note=
              [ "$latency" -ge 0 ] || note=" (negative: the caller's clock runs ahead)"
              line="dispatch latency: $latency s$note (source $source, seen $seen, run created $created)"
              echo "$line"
              echo "$line" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  plan:
    name: plan the newest snapshots against the last release
    needs: trigger
    # A Node.js release changes no Debian snapshot, so it has nothing to plan (ask-renovate handles it).
    # A release that failed or was cancelled published nothing new, so it starts no plan either.
    if: >-
      needs.trigger.outputs.source != 'node' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 25 # a failing plan is retried for 10 minutes, then the last try itself
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      debian: ${{ steps.plan.outputs.debian }}
      debian_security: ${{ steps.plan.outputs.debian_security }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the version tags

      # Between a merge and the end of its release the registry still holds the old images, so a plan
      # now would propose a snapshot for what is already on its way.
      - name: Is a release due or under way?
        id: busy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          python3 scripts/release_next.py pending > busy.txt
          cat busy.txt >> "$GITHUB_OUTPUT"
          running=0
          for workflow in release-next.yml release.yml; do
            for status in queued in_progress waiting pending requested; do
              count=$(gh run list --repo "$REPO" --workflow "$workflow" --status "$status" --json databaseId --jq length)
              running=$((running + count))
            done
          done
          echo "running=$running" >> "$GITHUB_OUTPUT"
          if grep -q '^pending=true' busy.txt || [ "$running" != 0 ]; then
            echo "Skipped: main holds inputs no release has published yet ($(cat busy.txt)), or $running release runs are not finished. If this lasts, read the release-next and release runs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: System packages (apt, gpgv and Debian's archive keyring, which planning needs)
        if: steps.busy.outputs.pending == 'false' && steps.busy.outputs.running == '0'
        run: |
          set -eu
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends apt gpgv debian-archive-keyring curl
          test -s /usr/share/keyrings/debian-archive-keyring.pgp

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.busy.outputs.pending == 'false' && steps.busy.outputs.running == '0'
        with:
          cosign-release: v3.1.4

      - name: The factory release the repository pins, signature verified, without the builder (this job never builds)
        if: steps.busy.outputs.pending == 'false' && steps.busy.outputs.running == '0'
        env:
          FACTORY_COSIGN: required
          FACTORY_BUILDER: skip
        run: scripts/factory install

      - name: Plan at the newest snapshots against what the last release published
        id: plan
        if: steps.busy.outputs.pending == 'false' && steps.busy.outputs.running == '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ASKED: ${{ needs.trigger.outputs.asked_snapshot }}
          ARCHIVE: ${{ needs.trigger.outputs.asked_archive }}
        run: |
          set -eu
          TAG=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          export TAG
          scripts/plan-snapshots work
          cat work/outputs.txt >> "$GITHUB_OUTPUT"
          cat work/summary.md >> "$GITHUB_STEP_SUMMARY"

  feed:
    name: write the snapshots for Renovate
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # the snapshot-feed branch only: one orphan commit holding the two feed files
    steps:
      # One file per archive, both in the one commit, so Renovate sees them move together. The check is
      # per file: a file that already holds its snapshot needs nothing, and the commit is written when
      # either differs.
      - name: Write the feed files to the snapshot-feed branch, unless both already hold their snapshot
        env:
          DEBIAN: ${{ needs.plan.outputs.debian }}
          SECURITY: ${{ needs.plan.outputs.debian_security }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -eu
          stale=false
          for pair in "debian-snapshot.json $DEBIAN" "debian-security-snapshot.json $SECURITY"; do
            file=${pair% *}
            id=${pair#* }
            now=$(gh api "repos/$REPO/contents/$file?ref=snapshot-feed" --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
            if printf '%s' "$now" | grep -q "\"$id\""; then
              echo "$file already holds $id"
            else
              stale=true
            fi
          done
          if [ "$stale" = false ]; then
            exit 0
          fi
          mkdir feed
          cd feed
          git init --quiet --initial-branch=snapshot-feed
          printf '{"releases": [{"version": "%s"}]}\n' "$DEBIAN" > debian-snapshot.json
          printf '{"releases": [{"version": "%s"}]}\n' "$SECURITY" > debian-security-snapshot.json
          git add debian-snapshot.json debian-security-snapshot.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Debian snapshots $DEBIAN and $SECURITY"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push --quiet --force "$SERVER/$REPO" HEAD:refs/heads/snapshot-feed
          echo "the feed now holds debian $DEBIAN and debian-security $SECURITY" >> "$GITHUB_STEP_SUMMARY"

  # Renovate runs on its own schedule. Its Dependency Dashboard has a box that asks for a run now;
  # ticking it is Renovate's own way to be called (docs.renovatebot.com, key concepts: dashboard).
  # It runs after a feed was written, or at once for a Node.js release, which Renovate's own
  # node-version datasource finds without a feed. A plan that was skipped or found nothing ticks nothing.
  ask-renovate:
    name: ask Renovate to run now
    needs: [trigger, plan, feed]
    if: "!cancelled() && (needs.feed.result == 'success' || needs.trigger.outputs.source == 'node')"
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write # ticks the Dependency Dashboard's "run again" box, so Renovate reads the feed now
    steps:
      - name: Ask Renovate to run now
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          issue=$(gh issue list --repo "$REPO" --author app/renovate --state open --search "Dependency Dashboard in:title" --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            echo "no Dependency Dashboard: Renovate reads the feed on its next scheduled run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh issue view "$issue" --repo "$REPO" --json body --jq .body > body.md
          if ! grep -q -- '- \[ \] <!-- manual job -->' body.md; then
            echo "the dashboard's run-again box is already ticked" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sed 's/- \[ \] <!-- manual job -->/- [x] <!-- manual job -->/' body.md > ticked.md
          gh issue edit "$issue" --repo "$REPO" --body-file ticked.md > /dev/null
          echo "asked Renovate to run now (dashboard #$issue)" >> "$GITHUB_STEP_SUMMARY"
